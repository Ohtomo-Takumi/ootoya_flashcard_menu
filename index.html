<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大戸屋 メニュー学習クイズ Pro</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --btn-hover: #f8f9fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

        .main-container {
            width: 95%;
            max-width: 550px;
            margin-top: 15px;
        }

        /* --- 共通カードスタイル --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none; 
            margin-bottom: 20px;
        }

        /* --- トップ画面（設定画面） --- */
        #top-screen { display: block; padding: 20px; }
        .setting-group { margin-bottom: 20px; }
        .setting-label { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; display: block; border-left: 4px solid var(--accent-color); padding-left: 8px;}
        
        select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: white;
            margin-bottom: 10px;
        }

        .mode-desc { font-size: 0.85rem; color: #7f8c8d; background: #f8f9fa; padding: 10px; border-radius: 6px; }

        .start-btn {
            background: var(--accent-color);
            color: white;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
            transition: 0.2s;
        }
        .start-btn:active { transform: translateY(2px); box-shadow: none; }

        .weakness-badge {
            display: inline-block;
            background: #f1c40f;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
        }

        /* --- クイズ画面 UI --- */
        .progress-bar {
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            margin: 0 auto 15px auto;
            display: none;
            text-align: center;
            width: fit-content;
        }

        .image-container {
            width: 100%;
            height: 40vh; 
            min-height: 200px;
            background-color: #dcdde1; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .no-image-text { position: absolute; color: #7f8c8d; font-size: 0.9rem; font-weight: bold; z-index: 1; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 2; background: white;}
        .q-badge { position: absolute; top: 10px; left: 10px; background: var(--accent-color); color: white; padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 0.85rem; z-index: 3; }

        .info-area { padding: 15px; }

        .nutrition-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .nutri-box { background: #f8f9fa; border: 1px solid #eee; padding: 8px 5px; text-align: center; border-radius: 8px; }
        .label { font-size: 0.7rem; color: #7f8c8d; display: block; }
        .val { font-size: 1rem; font-weight: bold; color: var(--primary-color); }

        .question-text { font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 15px; color: var(--primary-color); }
        .btn-list { display: flex; flex-direction: column; gap: 8px; }
        .choice-btn { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: #333; }
        .choice-btn.correct { background-color: var(--success-color) !important; color: white !important; border-color: var(--success-color) !important; }
        .choice-btn.wrong { background-color: var(--accent-color) !important; color: white !important; border-color: var(--accent-color) !important; }

        /* --- 詳細画面 UI --- */
        .detail-name { font-size: 1.2rem; font-weight: bold; color: var(--primary-color); margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid var(--primary-color); }
        .note-card { background: #fff3cd; border-radius: 8px; padding: 12px; color: #856404; margin-top: 15px; font-size: 0.9rem;}
        .next-btn { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: white; background: var(--primary-color); border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; }

        /* --- 結果画面 UI --- */
        #result-screen { text-align: center; padding: 25px 15px; }
        .result-title { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 10px; }
        .result-score { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
        
        .history-box { background: #f8f9fa; border-radius: 8px; padding: 15px; text-align: left; margin-bottom: 20px; border: 1px solid #ddd; }
        .history-box h3 { margin-top: 0; font-size: 1rem; color: var(--primary-color); border-bottom: 2px solid #ccc; padding-bottom: 5px; text-align: center; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #ccc; font-size: 0.9rem; }
        .history-item:last-child { border-bottom: none; }
        .h-qnum { font-weight: bold; color: #7f8c8d; width: 40px; }
        .h-name { flex-grow: 1; margin: 0 10px; }
        .mark-o { color: var(--success-color); font-weight: bold; }
        .mark-x { color: var(--accent-color); font-weight: bold; }

    </style>
</head>
<body>

<header>
    <h1>大戸屋 メニュー学習 Pro</h1>
</header>

<div class="progress-bar" id="progress-text">第 1 問 / 全 10 問</div>

<div class="main-container">
    
    <div id="top-screen" class="card">
        <h2 style="margin-top:0; color:var(--primary-color); text-align:center;">学習設定</h2>
        
        <div class="setting-group">
            <span class="setting-label">1. カテゴリ絞り込み</span>
            <select id="sel-category">
                <option value="all">すべてのメニュー</option>
                <option value="meat">豚肉・牛肉メニュー</option>
                <option value="chicken">鶏肉メニュー</option>
                <option value="fish">お魚メニュー</option>
                <option value="other">丼・その他メニュー</option>
            </select>
        </div>

        <div class="setting-group">
            <span class="setting-label">2. 学習モード</span>
            <select id="sel-mode" onchange="updateModeDesc()">
                <option value="standard">スタンダード（写真・栄養素から当てる）</option>
                <option value="accessory">小鉢・薬味クイズ（付属品を当てる）</option>
                <option value="tricky">ひっかけ特訓（似たメニューのみ出題）</option>
                <option value="review">ニガテ復習（過去に間違えた問題）</option>
            </select>
            <div id="mode-desc-text" class="mode-desc">写真と栄養素を見て、メニュー名を当てる基本モードです。</div>
            <div style="text-align: right; margin-top: 5px;">
                <span class="weakness-badge" id="weakness-count">ニガテ蓄積: 0件</span>
            </div>
        </div>

        <button class="start-btn" onclick="startSession()">特訓スタート</button>
    </div>

    <div id="front-card" class="card">
        <div class="image-container">
            <span class="q-badge" id="q-badge-text">クイズ</span>
            <div class="no-image-text">※画像が見つかりません</div>
            <img id="q-img" src="" alt="メニュー写真" onerror="this.style.display='none'">
        </div>
        <div class="info-area">
            <div class="nutrition-grid" id="q-nutrition-area">
                <div class="nutri-box"><span class="label">熱量</span><span class="val"><span id="q-cal">-</span><small>kcal</small></span></div>
                <div class="nutri-box"><span class="label">たんぱく質</span><span class="val"><span id="q-protein">-</span><small>g</small></span></div>
                <div class="nutri-box"><span class="label">脂質</span><span class="val"><span id="q-fat">-</span><small>g</small></span></div>
            </div>
            
            <div class="question-text" id="q-text">Q. このメニューはどれ？</div>
            <div id="choices" class="btn-list"></div>
        </div>
    </div>

    <div id="back-card" class="card">
        <div class="image-container">
            <div class="no-image-text">※画像が見つかりません</div>
            <img id="d-img" src="" alt="メニュー写真" onerror="this.style.display='none'">
        </div>
        <div class="info-area">
            <div id="d-name" class="detail-name">-</div>
            <div class="nutrition-grid">
                <div class="nutri-box"><span class="label">糖質</span><span class="val"><span id="d-carbs">-</span><small>g</small></span></div>
                <div class="nutri-box"><span class="label">食物繊維</span><span class="val"><span id="d-fiber">-</span><small>g</small></span></div>
                <div class="nutri-box"><span class="label">小鉢・薬味</span><span class="val" style="font-size:0.85rem;"><span id="d-acc">-</span></span></div>
            </div>
            <div class="note-card">
                <strong>💡 現場の注意ポイント</strong><br>
                <span id="d-note">-</span>
            </div>
            <button id="next-q-btn" class="next-btn" onclick="nextQuestion()">次の問題へ ▶</button>
        </div>
    </div>

    <div id="result-screen" class="card">
        <h2 class="result-title">特訓終了！</h2>
        <div class="result-score">正解: <span id="final-score">0</span> 問</div>
        
        <div class="history-box">
            <h3>📝 今回の解答履歴</h3>
            <ul id="history-list" class="history-list"></ul>
        </div>

        <button class="next-btn" onclick="returnToTop()" style="background:var(--accent-color);">トップ画面に戻る</button>
    </div>

</div>

];

// 「ひっかけ特訓モード」用の似ているメニュー群
const trickyNames = [
    "鶏と野菜の黒酢あん", "すけそう鱈と野菜の黒酢あん", "〈おかず増量〉鶏と野菜の黒酢あん", "〈おかず増量〉すけそう鱈と野菜の黒酢あん",
    "大戸屋ランチ", "〈おかず増量〉大戸屋ランチ", "大戸屋風チキン南蛮", "〈おかず増量〉大戸屋風チキン南蛮",
    "香味唐揚げ", "〈おかず増量〉香味唐揚げ", "もろみチキンの炭火焼き", "〈おかず増量〉もろみチキンの炭火焼き"
];

const QUESTIONS_PER_SESSION = 10;
let currentQuizList = [];
let currentQuestionIndex = 0;
let correctScore = 0;
let sessionHistory = []; 
let currentMode = "standard";

// ローカルストレージ（ニガテ記憶）の読み込み
let mistakesList = JSON.parse(localStorage.getItem('ootoya_mistakes')) || [];

function initTopScreen() {
    document.getElementById('top-screen').style.display = 'block';
    document.getElementById('front-card').style.display = 'none';
    document.getElementById('back-card').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('progress-text').style.display = 'none';
    document.getElementById('weakness-count').textContent = `ニガテ蓄積: ${mistakesList.length}件`;
}

function updateModeDesc() {
    const mode = document.getElementById('sel-mode').value;
    const descEl = document.getElementById('mode-desc-text');
    if(mode === 'standard') descEl.textContent = "写真と栄養素を見て、メニュー名を当てる基本モードです。";
    if(mode === 'accessory') descEl.textContent = "写真を見て「小鉢や薬味、ドレッシング」を当てる実践的モードです。";
    if(mode === 'tricky') descEl.textContent = "「黒酢あん」や「増量」など、間違いやすい似たメニューだけが出題されます。";
    if(mode === 'review') descEl.textContent = "過去のクイズで間違えたメニューだけを集中的に復習します。";
}

function startSession() {
    const category = document.getElementById('sel-category').value;
    currentMode = document.getElementById('sel-mode').value;

    let pool = [...menuData];

    // 1. カテゴリ絞り込み
    if(category !== 'all') {
        pool = pool.filter(m => m.cat === category);
    }

    // 2. モードによる絞り込み
    if(currentMode === 'tricky') {
        pool = pool.filter(m => trickyNames.includes(m.name));
    } else if (currentMode === 'review') {
        pool = pool.filter(m => mistakesList.includes(m.name));
        if(pool.length === 0) {
            alert("素晴らしい！現在ニガテとして登録されているメニューはありません。他のモードで挑戦してください！");
            return;
        }
    }

    // 問題数が足りない場合は調整
    let qCount = Math.min(pool.length, QUESTIONS_PER_SESSION);
    if(qCount === 0) {
        alert("該当するメニューがありません。条件を変えてみてください。");
        return;
    }

    pool.sort(() => Math.random() - 0.5);
    currentQuizList = pool.slice(0, qCount);
    
    currentQuestionIndex = 0;
    correctScore = 0;
    sessionHistory = []; 
    
    document.getElementById('top-screen').style.display = 'none';
    document.getElementById('progress-text').style.display = 'block';
    
    showQuestion();
}

function showQuestion() {
    document.getElementById('back-card').style.display = 'none';
    document.getElementById('front-card').style.display = 'block';
    
    document.getElementById('progress-text').textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${currentQuizList.length} 問`;

    let target = currentQuizList[currentQuestionIndex];

    let imgEl = document.getElementById('q-img');
    imgEl.style.display = 'block';
    imgEl.src = target.image;

    // モードによるUIの切り替え
    const nutriArea = document.getElementById('q-nutrition-area');
    const qText = document.getElementById('q-text');
    
    if(currentMode === 'accessory') {
        nutriArea.style.display = 'none';
        qText.textContent = `Q. 「${target.name}」の小鉢・薬味は？`;
    } else {
        nutriArea.style.display = 'grid';
        document.getElementById('q-cal').textContent = target.cal;
        document.getElementById('q-protein').textContent = target.protein;
        document.getElementById('q-fat').textContent = target.fat;
        qText.textContent = "Q. このメニューはどれ？";
    }

    // 選択肢の作成
    let choices = [];
    if(currentMode === 'accessory') {
        choices.push(target.acc);
        // 重複しないダミーの薬味を3つ用意
        let allAcc = [...new Set(menuData.map(m => m.acc))];
        allAcc = allAcc.filter(a => a !== target.acc).sort(() => Math.random() - 0.5);
        choices.push(allAcc[0], allAcc[1], allAcc[2]);
    } else {
        // 通常のメニュー名選択肢
        choices.push(target);
        // ひっかけモードなら、全メニューからではなく似た名前からダミーを選ぶとより難しくなる
        let dummyPool = (currentMode === 'tricky') ? menuData.filter(m => trickyNames.includes(m.name)) : menuData;
        while(choices.length < 4) {
            let dummy = dummyPool[Math.floor(Math.random() * dummyPool.length)];
            if(!choices.includes(dummy)) choices.push(dummy);
        }
    }
    
    choices.sort(() => Math.random() - 0.5);

    const btnArea = document.getElementById('choices');
    btnArea.innerHTML = '';
    choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = (currentMode === 'accessory') ? c : c.name;
        btn.onclick = () => judgeAnswer(btn, c, target);
        btnArea.appendChild(btn);
    });
}

function judgeAnswer(clickedBtn, selectedVal, targetMenu) {
    let isCorrect = false;
    let correctAnswerText = "";

    if(currentMode === 'accessory') {
        isCorrect = (selectedVal === targetMenu.acc);
        correctAnswerText = targetMenu.acc;
    } else {
        isCorrect = (selectedVal.name === targetMenu.name);
        correctAnswerText = targetMenu.name;
    }
    
    // ニガテ登録・解除ロジック
    if(!isCorrect) {
        if(!mistakesList.includes(targetMenu.name)) mistakesList.push(targetMenu.name);
    } else if (currentMode === 'review') {
        // 復習モードで正解したらニガテから削除
        mistakesList = mistakesList.filter(m => m !== targetMenu.name);
    }
    localStorage.setItem('ootoya_mistakes', JSON.stringify(mistakesList));

    // 履歴保存
    sessionHistory.push({ qNum: currentQuestionIndex + 1, name: targetMenu.name, isCorrect: isCorrect });
    
    const allBtns = document.querySelectorAll('.choice-btn');
    allBtns.forEach(b => {
        b.disabled = true;
        if(b.textContent === correctAnswerText) b.classList.add('correct');
    });

    if(isCorrect) {
        correctScore++;
    } else {
        clickedBtn.classList.add('wrong');
    }

    setTimeout(() => { showBackCard(targetMenu); }, 1200);
}

function showBackCard(target) {
    document.getElementById('front-card').style.display = 'none';
    document.getElementById('back-card').style.display = 'block';

    let imgEl = document.getElementById('d-img');
    imgEl.style.display = 'block';
    imgEl.src = target.image;
    
    document.getElementById('d-name').textContent = target.name;
    document.getElementById('d-carbs').textContent = target.carbs;
    document.getElementById('d-fiber').textContent = target.fiber;
    document.getElementById('d-acc').textContent = target.acc;
    document.getElementById('d-note').textContent = target.note;

    const nextBtn = document.getElementById('next-q-btn');
    if (currentQuestionIndex >= currentQuizList.length - 1) {
        nextBtn.textContent = "結果を見る ▶";
    } else {
        nextBtn.textContent = "次の問題へ ▶";
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuizList.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('front-card').style.display = 'none';
    document.getElementById('back-card').style.display = 'none';
    document.getElementById('progress-text').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    document.getElementById('final-score').textContent = `${correctScore} / ${currentQuizList.length}`;

    const historyList = document.getElementById('history-list');
    historyList.innerHTML = ''; 
    
    sessionHistory.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
            <span class="h-qnum">第${item.qNum}問</span>
            <span class="h-name">${item.name}</span>
            <span class="${item.isCorrect ? 'mark-o' : 'mark-x'}">${item.isCorrect ? '◯' : '✕'}</span>
        `;
        historyList.appendChild(li);
    });
}

function returnToTop() {
    initTopScreen();
}

// 起動時にトップ画面を表示
initTopScreen();

</script>
